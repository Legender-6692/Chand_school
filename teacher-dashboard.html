<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Teacher · Chand Public High School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a7a30; --ink-deep: #0f3a1c; --chalk: #f3f8ef; --bus: #8ad63f;
      --slate: #55695a; --line: #d3e0cd; --error: #b3261e; --error-bg: #fdecea;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: "Mukta", system-ui, sans-serif; font-size: 16.5px; color: var(--ink-deep); background: var(--chalk); min-height: 100vh; }
    h1, h2, h3 { font-family: "Bricolage Grotesque", sans-serif; letter-spacing: -0.01em; margin: 0; }

    header { background: var(--ink); color: #fff; padding: 14px 20px 0; position: relative; }
    header::after { content: ""; display: block; height: 8px; margin: 14px -20px 0;
      background: repeating-linear-gradient(90deg, var(--bus) 0 28px, var(--ink) 28px 40px); }
    .top { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .crest { width: 44px; height: 44px; border-radius: 50%; background: #fff; object-fit: cover; flex: none; display: block; }
    .top .name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 1.2rem; line-height: 1.1; }
    .top .who { color: #d4ecd7; font-size: .9rem; }
    .top .grow { flex: 1; min-width: 0; }
    .signout { background: none; border: 1.5px solid #5fae71; color: #fff; font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .signout:hover { border-color: #fff; }
    nav { max-width: 900px; margin: 14px auto 0; display: flex; gap: 4px; }
    nav button { flex: 1; min-width: 0; background: none; border: 0; color: #d4ecd7; font: inherit; font-weight: 500; padding: 11px 6px; text-align: center; border-radius: 8px 8px 0 0; cursor: pointer; }
    nav button[aria-current="page"] { background: var(--chalk); color: var(--ink-deep); font-weight: 700; }

    main { max-width: 900px; margin: 0 auto; padding: 26px 18px 60px; }
    section[hidden] { display: none; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-bottom: 22px; }
    .card h2 { font-size: 1.25rem; margin-bottom: 14px; }
    .lead { color: var(--slate); margin: 0 0 18px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: .97rem; }
    select, input { width: 100%; max-width: 320px; padding: 11px 12px; font: inherit; color: inherit; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
    select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--bus); outline-offset: 2px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
    .btn { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .97rem; }
    th { text-align: left; font-weight: 700; color: var(--slate); padding: 10px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { color: var(--slate); margin: 8px 0 0; }
    .msg { padding: 10px 14px; border-radius: 8px; background: #e1f2e3; color: var(--ink); margin-bottom: 14px; }
    .msg[hidden] { display: none; }
    .notice { border-top: 1px solid var(--line); padding: 14px 0; }
    .notice:first-of-type { border-top: 0; padding-top: 4px; }
    .notice h3 { font-size: 1.05rem; margin-bottom: 2px; }
    .notice time { color: var(--slate); font-size: .88rem; }
    .notice p { margin: 8px 0 0; white-space: pre-wrap; line-height: 1.5; }
    html, body { overflow-x: hidden; }
    .top .grow { overflow: hidden; }
    .top .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @media (max-width: 640px) {
      header { padding: 12px 14px 0; }
      header::after { margin: 12px -14px 0; }
      main { padding: 18px 12px 50px; }
      .card { padding: 16px; }
      select, input { max-width: none; }
      .row > div { flex: 1 1 100%; }
      .table-wrap { overflow: visible; }
      table, thead, tbody, tr, td { display: block; }
      thead { position: absolute; left: -9999px; }
      tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin-bottom: 10px; background: #fff; }
      td { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; border: 0; padding: 5px 0; text-align: right; }
      td::before { content: attr(data-label); color: var(--slate); font-weight: 700; font-size: .9rem; text-align: left; flex: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="top">
      <img class="crest" src="logo.png" alt="Chand Public High School logo">
      <div class="grow">
        <div class="name">Chand Public High School</div>
        <div class="who" id="userName">Teacher</div>
      </div>
      <button class="signout" id="logoutBtn" type="button">Sign out</button>
    </div>
    <nav aria-label="Sections">
      <button type="button" data-view="students" aria-current="page">Students</button>
      <button type="button" data-view="defaulters">Defaulters</button>
      <button type="button" data-view="notices">Notices</button>
    </nav>
  </header>

  <main>
    <section id="view-students">
      <div class="card">
        <h2>Class list</h2>
        <div class="row">
          <div><label for="s_class">Class</label><select id="s_class"></select></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Roll</th><th>Student</th><th>Father</th><th>Parent number</th></tr></thead>
            <tbody id="studentRows"></tbody>
          </table>
        </div>
        <p class="empty" id="studentEmpty">Choose a class to see its students.</p>
      </div>
    </section>

    <section id="view-defaulters" hidden>
      <div class="card">
        <h2>Defaulters</h2>
        <div id="d_info" class="msg" hidden></div>
        <div class="row">
          <div><label for="d_class">Class</label><select id="d_class"></select></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Class</th><th>Roll</th><th>Student</th><th>Father</th><th>Parent number</th><th class="num">Balance</th></tr></thead>
            <tbody id="defRows"></tbody>
          </table>
        </div>
        <p class="empty" id="defEmpty" hidden></p>
      </div>
    </section>

    <section id="view-notices" hidden>
      <div class="card">
        <h2>School notices</h2>
        <div id="notices"><p class="empty">Loading…</p></div>
      </div>
    </section>
  </main>

  <script type="module" src="teacher-dashboard.js?v=20261112c"></script>
</body>
</html>
